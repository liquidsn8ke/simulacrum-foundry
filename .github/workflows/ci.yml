name: CI

# Run the local test tiers on every push to the working branch and on pull requests.
on:
  push:
    branches: [personal]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:local
      # Build the archive without writing it, so a packaging break shows up before a release.
      - run: node tools/build-release.mjs --check
